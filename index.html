<!DOCTYPE HTML>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>現在の混雑状況</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header class="haeder">
	<h1>現在の混雑状況</h1>
	<p class="subtitle">リアルタイムの空き状況をお知らせします</p>
      </header>

      <section class="status-card" id="status-card" data-status="loading">
	<span class="status-label">現在の状況</span>
	<div class="status-badge" id="status-text">読み込み中...</div>
	<p class="status-comment" id="status-comment"></p>
	<div class="status-meta">
	  <span>最終更新:<time id="updated-at">--</time></span>
	</div>
      </section>

      <div class="actions">
	<button type="button" id="reload-btn" class="reload-btn">最新の情報に更新</button>
      </div>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
